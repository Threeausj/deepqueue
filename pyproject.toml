[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepqueue"
version = "0.1.0"
description = "Persistent GPU command queues with Codex app-server resource analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "paramiko>=3.5,<5", "cryptography>=44", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<17"]

[project.scripts]
deepqueue = "deepqueue.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "pyyaml>=6", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepqueue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".test-state", ".deepqueue"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
